<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python 3 エンジニア認定基礎試験 練習問題</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 id="logo-link">
    <span class="logo">Py</span>
    Python 3 基礎試験 練習問題
  </h1>
  <div class="header-right">
    <span class="header-info">全116問収録 · 合格ライン70%</span>
    <div id="header-auth-area">
      <!-- updateHeaderAuth() によって動的に更新されます -->
    </div>
  </div>
</header>

<!-- HOME PAGE -->
<div id="page-home" class="page active">
  <div class="home-hero">
    <h2>Python 3 エンジニア認定基礎試験</h2>
    <p>Pythonチュートリアル準拠の練習問題です。章を選んで集中学習するか、全章まとめて模擬試験に挑戦しましょう。</p>
    <div class="exam-meta">
      <div class="exam-meta-item"><strong>116問</strong>収録問題数</div>
      <div class="exam-meta-item"><strong>13章</strong>収録章数</div>
      <div class="exam-meta-item"><strong>70%</strong>合格ライン</div>
      <div class="exam-meta-item"><strong>選択式</strong>出題形式</div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:24px;">
    <button id="btn-mock" class="btn-all" style="background:linear-gradient(135deg,#e67e22,#d35400);">
      🎯 本番形式 模擬試験（40問・出題率に沿ったランダム出題）
    </button>
    <button id="btn-ai" class="btn-all" style="background:linear-gradient(135deg,#8e44ad,#6c3483);">
      🤖 AIオリジナル試験（40問・応用問題）
    </button>
    <button id="btn-all" class="btn-all" style="background:var(--primary);">
      📚 全問練習（全問収録・章ごとに学習）
    </button>
  </div>

  <div class="section-label">章を選んで練習</div>
  <div id="chapter-grid" class="chapter-grid"></div>
</div>

<!-- EXAM PAGE -->
<div id="page-exam" class="page">
  <div class="exam-header">
    <h2 id="exam-title"></h2>
    <div id="timer" class="timer">00:00</div>
  </div>

  <div class="progress-wrap">
    <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
  </div>

  <div class="question-card">
    <div id="q-number" class="q-number"></div>
    <div id="q-text" class="q-text"></div>
    <ul id="options-list" class="options-list"></ul>
    <div id="explanation" class="explanation-box"></div>
  </div>

  <div id="q-counter" style="text-align:center; font-size:13px; color:var(--text-muted); margin-bottom:12px;"></div>

  <div class="nav-buttons">
    <button id="btn-prev" class="btn btn-secondary">◀ 前の問題</button>
    <button id="btn-reveal" class="btn btn-answer">答えを確認</button>
    <button id="btn-next" class="btn btn-primary">次の問題 ▶</button>
    <button id="btn-finish" class="btn btn-success" style="display:none">結果を見る</button>
  </div>

  <div style="text-align:center; margin-top:16px; display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
    <button id="btn-back-result" class="btn btn-primary" style="font-size:13px; padding:8px 20px; display:none;">← 結果画面に戻る</button>
    <button id="btn-back-home" class="btn btn-secondary" style="font-size:13px; padding:8px 20px;">← チャプター選択に戻る</button>
  </div>
</div>

<!-- RESULT PAGE -->
<div id="page-result" class="page">
  <div class="result-card">
    <div id="score-circle" class="score-circle">
      <div class="score-inner">
        <div id="score-num" class="score-num">0</div>
        <div id="score-denom" class="score-denom">/ 0</div>
      </div>
    </div>
    <div id="result-title" class="result-title"></div>
    <div id="result-pct" class="result-subtitle"></div>
    <div id="pass-badge" class="pass-badge"></div>
    <div id="result-time" style="font-size:13px; color:var(--text-muted); margin-top:4px;"></div>
    <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
      <button id="btn-retry" class="btn btn-primary">もう一度挑戦</button>
      <button id="btn-result-home" class="btn btn-secondary">チャプター選択に戻る</button>
    </div>
  </div>

  <div class="section-label">問題ごとの解説</div>
  <div id="review-list" class="review-list"></div>

  <div style="text-align:center; margin-top:24px;">
    <button id="btn-result-home2" class="btn btn-secondary" onclick="renderHome()">← トップに戻る</button>
  </div>
</div>

<!-- AUTH PAGE（ログイン / 新規登録） -->
<div id="page-auth" class="page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active">ログイン</button>
        <button id="tab-register" class="auth-tab">新規登録</button>
      </div>

      <!-- ログインフォーム -->
      <div id="auth-login-form">
        <div class="form-group">
          <label for="login-username">アカウント名</label>
          <input type="text" id="login-username" class="form-input"
            placeholder="アカウント名を入力" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-password">パスワード</label>
          <input type="password" id="login-password" class="form-input"
            placeholder="パスワードを入力" autocomplete="current-password">
        </div>
        <div id="login-error" class="auth-error" aria-live="polite"></div>
        <button id="btn-do-login" class="btn btn-primary auth-submit-btn">ログイン</button>
      </div>

      <!-- 新規登録フォーム -->
      <div id="auth-register-form" style="display:none">
        <div class="form-group">
          <label for="reg-username">
            アカウント名
            <span class="form-hint">3〜20文字（半角英数字・_・-）</span>
          </label>
          <input type="text" id="reg-username" class="form-input"
            placeholder="アカウント名を入力" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="reg-password">
            パスワード
            <span class="form-hint">8文字以上</span>
          </label>
          <input type="password" id="reg-password" class="form-input"
            placeholder="パスワードを入力" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="reg-password2">パスワード（確認）</label>
          <input type="password" id="reg-password2" class="form-input"
            placeholder="もう一度入力してください" autocomplete="new-password">
        </div>
        <div id="register-error" class="auth-error" aria-live="polite"></div>
        <button id="btn-do-register" class="btn btn-primary auth-submit-btn">アカウントを作成</button>
      </div>

      <div class="auth-footer">
        <button onclick="renderHome()" class="btn btn-secondary"
          style="font-size:13px; padding:8px 20px;">← トップに戻る</button>
      </div>
    </div>
  </div>
</div>

<!-- HISTORY PAGE（解答履歴） -->
<div id="page-history" class="page">
  <div class="history-page-inner">
    <div class="history-page-header">
      <h2 class="history-page-title">解答履歴</h2>
      <button onclick="renderHome()" class="btn btn-secondary"
        style="font-size:13px; padding:8px 20px;">← チャプター選択に戻る</button>
    </div>
    <div id="history-list"></div>
  </div>
</div>

<!-- トースト通知 -->
<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
<script src="questions.js"></script>
<script src="ai_questions.js"></script>
<script src="auth.js"></script>
<script src="history-api.js"></script>
<script src="script.js"></script>
</body>
</html>
